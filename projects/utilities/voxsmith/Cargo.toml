[package]
name = "voxsmith"
version = "0.3.1"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Utilities for working with voxels."

[package.metadata.workspaces]
independent = true

[dependencies]
branded-id = "0.1.7"
meshdoc = "0.1.0"
pathspec = "0.2.0"
png = { version = "0.18.1", optional = true }
serde_json = { version = "1", optional = true }
treegrid = { version = "0.2.0", features = [
    "json",
    "ty-math",
], optional = true }
treeselect = { version = "0.1.1", optional = true }
ty-math = "0.2.0"
vox-value-language = { version = "0.1.0", optional = true }
voxcore = { version = "0.2.1", default-features = false, features = ["color"] }
zune-jpeg = { version = "0.5", optional = true }

[features]
default = [
    "hierarchy",
    "impl",
    "mesh_doc",
    "node",
    "object",
    "object_voxels",
    "palette",
    "profile",
    "vox_doc",
]

hierarchy = ["_treegrid", "dep:treeselect"]
mesh_doc = []
node = []
object = ["dep:serde_json", "dep:vox-value-language"]
object_voxels = []
palette = ["_treegrid", "dep:serde_json"]
profile = ["_treegrid"]
vox_doc = ["_treegrid"]

impl = ["dep:png", "dep:zune-jpeg"]

_treegrid = ["dep:treegrid"]

[dev-dependencies]
png = "0.18"
